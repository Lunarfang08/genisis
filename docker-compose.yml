name: genesis

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis -d genesis"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      GENESIS_ENVIRONMENT: development
      GENESIS_DATABASE_URL: postgresql+asyncpg://genesis:genesis@postgres:5432/genesis
      GENESIS_REDIS_URL: redis://redis:6379/0
      GENESIS_CORS_ORIGINS: '["http://localhost:3000"]'
      GENESIS_AUTH_SECRET_KEY: ${GENESIS_AUTH_SECRET_KEY:-development-only-change-me-at-least-32-characters}
      GENESIS_AI_ENABLED: ${GENESIS_AI_ENABLED:-false}
      GENESIS_AI_PROVIDER: ${GENESIS_AI_PROVIDER:-mock}
      GENESIS_AI_MODEL: ${GENESIS_AI_MODEL:-llama-3.3-70b-versatile}
      GENESIS_AI_DAILY_CALL_BUDGET: ${GENESIS_AI_DAILY_CALL_BUDGET:-5}
      GENESIS_AI_TIMEOUT_SECONDS: ${GENESIS_AI_TIMEOUT_SECONDS:-15}
      GENESIS_GROQ_API_KEY: ${GENESIS_GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["genesis-worker"]
    environment:
      GENESIS_ENVIRONMENT: development
      GENESIS_DATABASE_URL: postgresql+asyncpg://genesis:genesis@postgres:5432/genesis
      GENESIS_REDIS_URL: redis://redis:6379/0
      GENESIS_AUTH_SECRET_KEY: ${GENESIS_AUTH_SECRET_KEY:-development-only-change-me-at-least-32-characters}
      GENESIS_AI_ENABLED: ${GENESIS_AI_ENABLED:-false}
      GENESIS_AI_PROVIDER: ${GENESIS_AI_PROVIDER:-mock}
      GENESIS_AI_MODEL: ${GENESIS_AI_MODEL:-llama-3.3-70b-versatile}
      GENESIS_AI_DAILY_CALL_BUDGET: ${GENESIS_AI_DAILY_CALL_BUDGET:-5}
      GENESIS_AI_TIMEOUT_SECONDS: ${GENESIS_AI_TIMEOUT_SECONDS:-15}
      GENESIS_GROQ_API_KEY: ${GENESIS_GROQ_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      GENESIS_DATABASE_URL: postgresql+asyncpg://genesis:genesis@postgres:5432/genesis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      GENESIS_INTERNAL_API_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
