[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "genesis-api"
version = "0.14.0"
description = "GENESIS API and service orchestration layer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "genesis-simulation==0.14.0",
  "httpx==0.28.1",
  "pyjwt==2.10.1",
  "pydantic-settings==2.10.1",
  "redis==6.2.0",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[tool.uv.sources]
genesis-simulation = { path = "../../packages/simulation" }

[project.scripts]
genesis-worker = "genesis_api.worker:main"

[dependency-groups]
dev = [
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "../../packages/simulation/src"
